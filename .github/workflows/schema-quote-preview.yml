name: Preview schema API prices

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out the example
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the catalog with live Base quotes
        shell: bash
        run: python3 examples/schema-quote-preview.py | tee -a "$GITHUB_STEP_SUMMARY"
